include: package:flutter_lints/flutter.yaml

# The Avio design rules (no raw colours, TextStyles or Material icons; images
# decoded at their drawn size; spacing on the 4 px grid; hairlines from the
# SDK) are checked by test/design_rules_test.dart, which `flutter test` runs.
# The SDK's DESIGN_LANGUAGE.md is the source of every rule.

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    require_trailing_commas: true
    use_super_parameters: true
    use_colored_box: true
    use_decorated_box: true

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The SDK keeps a replaced (v1) API one release as @Deprecated, naming
    # its replacement. An app migrates at once: a deprecated SDK member is
    # an error, not a hint.
    deprecated_member_use: error
  exclude:
    - '**/*.g.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
