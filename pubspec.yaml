# Rename `name:` after instantiating from the template; must be snake_case
# and match `flutter create --project-name`.
name: avio_app_template
description: Avio Linux application scaffold.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Avio design system. Pinned to a tag in CI; override locally via
  # pubspec_overrides.yaml for cross-repo development (see
  # pubspec_overrides.yaml.example).
  avio_ui:
    git:
      url: https://github.com/avio-os/avio-sdk.git
      path: packages/avio_ui
      ref: e5b00dfd0932621a5046a6fc39eb0cfb129af0a4
  avio_system:
    git:
      url: https://github.com/avio-os/avio-sdk.git
      path: packages/avio_system
      ref: e5b00dfd0932621a5046a6fc39eb0cfb129af0a4

  # State management and logging. Riverpod without code generation: write
  # providers by hand, keep their imports in `*_provider.dart` files, and write
  # immutable state classes yourself (final fields, const constructor,
  # copyWith). No freezed, no json_serializable, no build_runner.
  flutter_riverpod: ^3.0.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Riverpod's lints run through custom_lint (`dart run custom_lint`). Neither
  # needs a code generator, so there is no build_runner step in this template.
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.0

flutter:
  uses-material-design: true
  assets:
    # Flutter fails the build when a declared asset directory is missing, and
    # git does not track empty directories — hence assets/.gitkeep.
    - assets/
